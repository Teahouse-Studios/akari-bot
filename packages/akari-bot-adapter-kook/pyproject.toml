[project]
name = "akari-bot-adapter-kook"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "khl-py>=0.3.16,<1.0.0",
]

[project.entry-points."akari.bots"]
kook = "bots.kook"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bots.kook"
module-root = "src"
namespace = true
