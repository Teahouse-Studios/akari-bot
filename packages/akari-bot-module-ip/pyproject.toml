[project]
name = "akari-bot-module-ip"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
]

[project.entry-points."akari.modules"]
ip = "modules.ip"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modules.ip"
module-root = "src"
namespace = true
