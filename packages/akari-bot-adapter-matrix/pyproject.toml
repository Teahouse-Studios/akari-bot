[project]
name = "akari-bot-adapter-matrix"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "matrix-nio>=0.25.0,<1.0.0",
]

[project.entry-points."akari.bots"]
matrix = "bots.matrix"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bots.matrix"
module-root = "src"
namespace = true
