[project]
name = "akari-bot-adapter-web"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "akari-bot-webui==0.6.4",
    "argon2-cffi>=25.0.0,<26.0.0",
    "cryptography>=50.0.0,<50.1.0",
    "py-cpuinfo>=9.0.0,<10.0.0",
    "pyjwt[crypto]>=2.8.0,<3.0.0",
    "pyotp>=2.9.0,<3.0.0",
    "python-multipart>=0.0.22,<1.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "urllib3>=2.6.3",
]

[project.entry-points."akari.bots"]
web = "bots.web"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bots.web"
module-root = "src"
namespace = true
