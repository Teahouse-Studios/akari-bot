[project]
name = "akari-bot-module-twenty_four"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "simpleeval>=1.0.0,<2.0.0",
]

[project.entry-points."akari.modules"]
twenty_four = "modules.twenty_four"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modules.twenty_four"
module-root = "src"
namespace = true
