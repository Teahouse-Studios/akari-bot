[project]
name = "akari-bot-adapter-milky"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "milky-python-sdk>=0.4.2",
]

[project.entry-points."akari.bots"]
milky = "bots.milky"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bots.milky"
module-root = "src"
namespace = true
