[project]
name = "akari-bot-module-mcserver"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "mcstatus>=14.1.0,<14.2.0",
]

[project.entry-points."akari.modules"]
mcserver = "modules.mcserver"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modules.mcserver"
module-root = "src"
namespace = true
