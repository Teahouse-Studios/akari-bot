[project]
name = "akari-bot-module-wiki"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "beautifulsoup4>=4.11.1,<5.0.0",
    "wikitextparser>=1.0.3",
]

[project.entry-points."akari.modules"]
wiki = "modules.wiki"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modules.wiki"
module-root = "src"
namespace = true
