[project]
name = "akari-bot-module-mcv"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "google-play-scraper>=1.2.2,<2.0.0",
]

[project.entry-points."akari.modules"]
mcv = "modules.mcv"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modules.mcv"
module-root = "src"
namespace = true
