[project]
name = "akari-bot-module-color"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "numpy<2.5.5",
    "webcolors>=25.0.0,<26.0.0",
]

[project.entry-points."akari.modules"]
color = "modules.color"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modules.color"
module-root = "src"
namespace = true
