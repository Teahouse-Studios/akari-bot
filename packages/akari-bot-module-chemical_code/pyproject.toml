[project]
name = "akari-bot-module-chemical_code"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "rdkit>=2026.3.1,<2026.4.0",
]

[project.entry-points."akari.modules"]
chemical_code = "modules.chemical_code"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modules.chemical_code"
module-root = "src"
namespace = true
