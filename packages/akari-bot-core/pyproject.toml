[project]
name = "akari-bot-core"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-i18n==0.2.2",
    "akari-bot-webrender==0.7.4",
    "deprecated>=1.2.18,<2.0.0",
    "ff3>=1.0.2,<2.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "pywin32>=312,<313; platform_system == 'Windows'",
    "cattrs>=26.1.0,<26.2.0",
    "filetype>=1.2.0,<2.0.0",
    "orjson>=3.10.9,<4.0.0",
    "Pillow>=13.0.0,<13.1.0",
    "rapidfuzz>=3.14.5",
    "tenacity>=9.0.0,<10.0.0",
    "tomlkit>=0.14.0,<1.0.0",
    "tortoise-orm[asyncmy]>=1.1.2,<1.2.0",
    "aiofile>=3.8.1,<4.0.0",
    "attrs>=26.1.0",
    "httpx>=0.28.1,<1.0.0",
    "httpx-ws>=0.9.0,<1.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "loguru>=0.7.0,<1.0.0",
    "fastapi>=0.120.0,<1.0.0",
    "uvicorn[standard]>=0.38.0,<1.0.0",
    "APScheduler>=3.9.1-post.0,<4.0.0.0",
    "defusedxml>=0.7.1",
    "psutil>=7.0.0,<8.0.0",
    "regex>=2026.5.9,<2027.0.0",
    "tabulate>=0.9.0,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "core"
module-root = "src"
