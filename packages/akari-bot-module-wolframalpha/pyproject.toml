[project]
name = "akari-bot-module-wolframalpha"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "wolframalpha>=5.0.0,<6.0.0",
]

[project.entry-points."akari.modules"]
wolframalpha = "modules.wolframalpha"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modules.wolframalpha"
module-root = "src"
namespace = true
