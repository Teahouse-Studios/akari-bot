[project]
name = "akari-bot-module-convert"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "pint>=0.25.0,<1.0.0",
]

[project.entry-points."akari.modules"]
convert = "modules.convert"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modules.convert"
module-root = "src"
namespace = true
