[project]
name = "akari-bot-adapter-onebot"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "aiocqhttp>=1.4.3,<2.0.0",
]

[project.entry-points."akari.bots"]
onebot = "bots.onebot"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bots.onebot"
module-root = "src"
namespace = true
