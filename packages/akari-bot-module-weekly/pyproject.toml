[project]
name = "akari-bot-module-weekly"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "beautifulsoup4>=4.11.1,<5.0.0",
    "feedparser>=6.0.10,<7.0.0",
]

[project.entry-points."akari.modules"]
weekly = "modules.weekly"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modules.weekly"
module-root = "src"
namespace = true
