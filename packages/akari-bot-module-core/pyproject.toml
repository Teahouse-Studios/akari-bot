[project]
name = "akari-bot-module-core"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "matplotlib>=3.6.3,<4.0.0",
    "py-cpuinfo>=9.0.0,<10.0.0",
]

[project.entry-points."akari.modules"]
core = "modules.core"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modules.core"
module-root = "src"
namespace = true
