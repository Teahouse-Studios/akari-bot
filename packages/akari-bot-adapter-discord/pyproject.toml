[project]
name = "akari-bot-adapter-discord"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "py-cord>=2.7.2",
]

[project.entry-points."akari.bots"]
discord = "bots.discord"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bots.discord"
module-root = "src"
namespace = true
