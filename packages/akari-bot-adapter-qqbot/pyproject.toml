[project]
name = "akari-bot-adapter-qqbot"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "boto3>=1.35.0,<2.0.0",
    "qq-botpy-sdk==2.3.0",
]

[project.entry-points."akari.bots"]
qqbot = "bots.qqbot"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bots.qqbot"
module-root = "src"
namespace = true
