[project]
name = "akari-bot-module-emojimix"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "emoji>=2.12.1,<3.0.0",
]

[project.entry-points."akari.modules"]
emojimix = "modules.emojimix"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modules.emojimix"
module-root = "src"
namespace = true
