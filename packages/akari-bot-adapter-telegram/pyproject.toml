[project]
name = "akari-bot-adapter-telegram"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "aiogram==3.31.0",
]

[project.entry-points."akari.bots"]
telegram = "bots.telegram"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bots.telegram"
module-root = "src"
namespace = true
