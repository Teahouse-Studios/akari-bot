[project]
name = "akari-bot-adapter-satori"
version = "5.1.3"
requires-python = ">=3.12.0,<4.0.0"
dependencies = [
    "akari-bot-core",
    "satori-python-client>=1.3.11",
]

[project.entry-points."akari.bots"]
satori = "bots.satori"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bots.satori"
module-root = "src"
namespace = true
