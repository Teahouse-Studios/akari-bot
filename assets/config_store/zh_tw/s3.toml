# https://toml.io/cn/v1.0.0
# 注意：TOML 不是 Python。請不要在此處使用 Python 語法。
# 例如：TOML 中的布林值必須是小寫。

[s3]
# S3 相容 API 的組態部分，此處填寫的值可在訊息中以明文形式顯示。請不要在此部分填寫敏感資訊。
s3_endpoint_url = "<Replace me with str value>" # S3 相容 API 的端點 URL。
s3_bucket = "<Replace me with str value>" # S3 相容 API 的桶名。
s3_region = "us-east-1" # S3 相容 API 的地域名。
s3_public_endpoint = "<Replace me with str value>" # S3 相容 API 的公網存取 URL。
s3_internal_endpoint = "<Replace me with str value>" # S3 相容 API 的內網存取 URL。
s3_temp_max_count = 20 # S3 相容 API 的暫存檔案最大數量。
s3_connect_timeout = 5 # S3 兼容 API 的连接超时时间，单位为秒。
s3_read_timeout = 15 # S3 兼容 API 的网络读取超时时间，单位为秒。
s3_operation_timeout = 40 # S3 兼容 API 单次完整操作的最长等待时间，单位为秒。
s3_max_attempts = 2 # S3 兼容 API 单次请求包含首次请求在内的最大尝试次数。
s3_max_workers = 4 # S3 兼容 API 专用线程池的最大线程数。

[s3_secret]
# S3 相容 API 的金鑰組態部分，此處的值若意外出現在傳送的訊息中，機器人會嘗試攔截。但請務必提防洩漏。
s3_access_key = "<Replace me with str value>" # S3 相容 API 的 AccessKey。
s3_secret_key = "<Replace me with str value>" # S3 相容 API 的 SecretKey。
