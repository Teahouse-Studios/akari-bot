# https://toml.io/cn/v1.0.0
# 注意：TOML 不是 Python。請不要在此處使用 Python 語法。
# 例如：TOML 中的布林值必須是小寫。

[bot_satori]
# 用戶端的組態部分，此處填寫的值可在訊息中以明文顯示。請不要在此部分填寫敏感資訊。
enable = false # 是否啟用此用戶端。
satori_host = "127.0.0.1" # Satori 伺服器的主機位址。
satori_port = 5140 # Satori 伺服器的連接埠。
satori_path = "<Replace me with str value>" # Satori 伺服器 API 的路徑前綴。
satori_secure = false # 是否以 HTTPS 與 WSS 連線 Satori 伺服器。
satori_timeout = 30 # 呼叫 Satori API 的逾時時間，單位為秒。
satori_enable_listening_self_message = false # 是否監聽機器人自身傳送的訊息。
satori_admin_roles = ["admin", "owner"] # 被視為管理員的群組角色 ID 或名稱。
satori_typing_emoji = "⌛" # 處理訊息期間向訊息掛上的回應表情 ID，需協定端支援。留空則不顯示。
satori_limited_emoji = "❌" # 訊息處理失敗時向訊息掛上的回應表情 ID，需協定端支援。留空則不顯示。

[bot_satori_secret]
# 用戶端的金鑰組態部分，此處的值若意外出現在傳送的訊息中，機器人會嘗試攔截。但請務必提防洩漏。
satori_token = "<Replace me with str value>" # 連線 Satori 伺服器所使用的令牌，伺服器未設定驗證時留空。
