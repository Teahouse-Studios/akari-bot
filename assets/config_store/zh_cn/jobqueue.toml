# https://toml.io/cn/v1.0.0
# 注意：TOML 不是 Python。请不要在此处使用 Python 语法。
# 例如：TOML 中的布尔值必须是小写。

[jobqueue]
# JobQueue 的非敏感配置部分。请勿在此处填写访问令牌等敏感信息。

# JobQueue 必须在 database 与 websocket 中选择一套完整后端。
# database：无需额外部署 Hub，且可在共享数据库中保留尚未过期的队列记录；但轮询、领取、心跳与清理均会增加数据库负载。使用 SQLite 时，这些写入会与业务数据竞争唯一写锁，仅建议用于低负载部署。
# websocket：项目推荐选项。经 Hub 实时路由，延迟较低，且可以移除 JobQueue 对业务数据库的轮询和写入竞争，较适合 SQLite、高频信号与同类多实例；但需要维护 Hub、长连接以及远程连接所需的令牌和 TLS。
# 所有进程必须使用同一后端。WebSocket 仅处理在线投递，不持久化离线任务或在途结果；连接或鉴权失败时不会自动回退至数据库，以避免形成不一致的双重通信通道。
jobqueue_backend = "websocket" # JobQueue 使用的完整传输后端，推荐 websocket，可选 database 或 websocket。
jobqueue_node_id = "<Replace me with str value>" # JobQueue 节点标识，长度不得超过 128 个字符。未填写时，每个进程在启动时分别生成新的 UUID；为多个进程填写相同值可将其归入同一部署节点。
jobqueue_websocket_mode = "embedded" # WebSocket Hub 部署模式，可选 embedded 或 external。embedded 由守护进程启动本机 Hub；external 连接独立部署的 Hub。
jobqueue_websocket_url = "ws://127.0.0.1:8765/jobqueue" # WebSocket JobQueue Hub 的统一地址。embedded 模式同时从该地址取得监听主机、端口和路径；external 模式将其作为客户端连接地址。
jobqueue_websocket_queue_size = 1000 # 每个 WebSocket Peer 的最大待发送帧数量，队列满时新投递将被拒绝。
jobqueue_websocket_max_message_bytes = 1048576 # 单个 WebSocket 协议帧允许的最大字节数。
jobqueue_websocket_command_timeout = 10 # WebSocket 控制命令的超时时间，单位为秒。

[jobqueue_secret]
# JobQueue 的密钥配置部分。机器人会尝试拦截意外出现在消息中的值，但仍须妥善保管以防泄露。
jobqueue_websocket_token = "" # WebSocket JobQueue Hub 的共享访问令牌。非本机监听或远程连接时必须配置。
