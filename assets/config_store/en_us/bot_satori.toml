# https://toml.io/en/v1.0.0
# NOTE: TOML is not like Python. Do not use Python syntax here.
# EXAMPLE: Boolean values in TOML must be lowercase.

[bot_satori]
# The basic config section of the client. The values entered here can be displayed in the message. Please do not enter sensitive information in this section.
enable = false # Whether to enable this client.
satori_host = "127.0.0.1" # The host address of the Satori server.
satori_port = 5140 # The port of the Satori server.
satori_path = "<Replace me with str value>" # The path prefix of the Satori server API.
satori_secure = false # Whether to connect to the Satori server over HTTPS and WSS.
satori_timeout = 30 # The timeout for calling the Satori API, in seconds.
satori_enable_listening_self_message = false # Whether to listen for messages sent by the bot itself.
satori_admin_roles = ["admin", "owner"] # The IDs or names of the guild roles that are treated as administrators.
satori_typing_emoji = "⌛" # The reaction emoji ID attached to the message while the message is being processed. It needs to be supported by the protocol terminal. Leave it empty to hide it.
satori_limited_emoji = "❌" # The reaction emoji ID attached to the message when message processing fails. It needs to be supported by the protocol terminal. Leave it empty to hide it.

[bot_satori_secret]
# The secret config section of the client. The bot will try to intercept if the values here accidentally appear in the messages sent, but be careful to prevent leakage.
satori_token = "<Replace me with str value>" # The token used to connect to the Satori server. Leave it empty when the server is not configured with authentication.
