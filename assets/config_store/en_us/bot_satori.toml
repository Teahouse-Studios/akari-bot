# https://toml.io/en/v1.0.0
# NOTE: TOML is not like Python. Do not use Python syntax here.
# EXAMPLE: Boolean values in TOML must be lowercase.

[bot_satori]
# The basic config section of the client. The values entered here can be displayed in the message. Please do not enter sensitive information in this section.
enable = false # Whether to enable this client.
satori_host = "127.0.0.1" # Satori 服务端的主机地址。
satori_port = 5140 # Satori 服务端的端口。
satori_path = "<Replace me with str value>" # Satori 服务端 API 的路径前缀。
satori_secure = false # 是否以 HTTPS 与 WSS 连接 Satori 服务端。
satori_timeout = 30 # 调用 Satori API 的超时时间，单位为秒。
satori_enable_listening_self_message = false # 是否监听机器人自身发送的消息。
satori_admin_roles = ["admin", "owner"] # 被视作管理员的群组角色 ID 或名称。
satori_typing_emoji = "⌛" # 处理消息期间向消息挂上的表态表情 ID，需协议端支持。留空则不显示。
satori_limited_emoji = "❌" # 消息处理失败时向消息挂上的表态表情 ID，需协议端支持。留空则不显示。

[bot_satori_secret]
# The secret config section of the client. The bot will try to intercept if the values here accidentally appear in the messages sent, but be careful to prevent leakage.
satori_token = "<Replace me with str value>" # 连接 Satori 服务端使用的令牌，服务端未配置鉴权时留空。
