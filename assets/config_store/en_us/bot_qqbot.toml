# https://toml.io/en/v1.0.0
# NOTE: TOML is not like Python. Do not use Python syntax here.
# EXAMPLE: Boolean values in TOML must be lowercase.

[bot_qqbot]
# The basic config section of the client. The values entered here can be displayed in the message. Please do not enter sensitive information in this section.
enable = false # Whether to enable this client.
qq_bot_appid = "<Replace me with (str, int) value>" # The QQ official robot AppID.
qq_bot_openid = "<Replace me with str value>" # The QQ official robot OpenID.
qq_bot_enable_send_url = false # Whether to enable sending URLs when using QQ official robot.
qq_private_bot = false # Whether it is a private bot when using the QQ official robot.
qq_typing_emoji = 181 # When using the QQ official robot, the response emoji ID attached to the message when processing the message. For details of emoji ID, see: https://bot.q.qq.com/wiki/develop/api-v2/openapi/emoji/model.html#Emoji
qq_limited_emoji = 10060 # When using the QQ official robot, the response emoji ID attached to the message when message processing fails. For details of emoji ID, see: https://bot.q.qq.com/wiki/develop/api-v2/openapi/emoji/model.html#Emoji
qq_use_markdown = false # Whether to use Markdown-formatted messages when using QQ official robot. (requires configuring S3-compatible API storage for images)
qq_navigation_sync_strict = false # Whether to prevent the client from launching when synchronizing the global menu and command panel of QQ official robot fails.
qq_bot_uid = "<Replace me with str value>" # QQ 机器人（官方）的 UID，用于生成群聊权限配置链接。
qq_bot_qqnum = "<Replace me with str value>" # QQ 机器人（官方）的 QQ 号，用于生成群聊权限配置链接。

[bot_qqbot_secret]
# The secret config section of the client. The bot will try to intercept if the values here accidentally appears in the message sent, but be careful to prevent leakage.
qq_bot_secret = "<Replace me with str value>" # The QQ official robot AppSecret.
