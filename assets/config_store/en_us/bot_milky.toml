# https://toml.io/en/v1.0.0
# NOTE: TOML is not like Python. Do not use Python syntax here.
# EXAMPLE: Boolean values in TOML must be lowercase.

[bot_milky]
# The basic config section of the client. The values entered here can be displayed in the message. Please do not enter sensitive information in this section.
enable = false # Whether to enable this client.
qq_host = "http://127.0.0.1:8080" # The address of the Milky protocol HTTP service.
qq_enable_listening_self_message = false # Whether to enable self-message monitoring when using the Milky protocol.
qq_enable_temp_session = true # Whether to enable temp sessions when using the Milky protocol.
qq_allow_approve_friend = false # Whether to automatically approve friend requests when using the Milky protocol.
qq_allow_approve_group_invite = false # Whether to automatically accept group invitations when using the Milky protocol.
qq_typing_emoji = 181 # When using the Milky protocol, the reaction emoji ID attached to the message when processing the message. It needs to be supported by the protocol terminal. For details of emoji ID, see: https://bot.q.qq.com/wiki/develop/api-v2/openapi/emoji/model.html#Emoji
qq_limited_emoji = 10060 # When using the Milky protocol, the reaction emoji ID attached to the message when message processing fails. It needs to be supported by the protocol terminal. For details of emoji ID, see: https://bot.q.qq.com/wiki/develop/api-v2/openapi/emoji/model.html#Emoji
qq_initiative_msg_cooldown = 10 # Cooldown in seconds for sending proactive messages.

[bot_milky_secret]
# The secret config section of the client. The bot will try to intercept if the values here accidentally appears in the message sent, but be careful to prevent leakage.
qq_access_token = "<Replace me with str value>" # Access Token for connecting to the Milky protocol HTTP service.
