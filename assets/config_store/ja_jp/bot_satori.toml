# https://toml.io/ja/v1.0.0
# 注：TOML は Python ではありませんので、ここでは Python の文法を使用しないでください。
# 例：TOML のブール値は小文字である必要があります。

[bot_satori]
# クライアントの設定項目です。ここに入力された値は、メッセージ内にプレーンテキストで表示されます。この部分には機密情報を入力しないでください。
enable = false # このクライアントを有効にするかどうか。
satori_host = "127.0.0.1" # Satori サーバーのホスト アドレス。
satori_port = 5140 # Satori サーバーのポート。
satori_path = "<Replace me with str value>" # Satori サーバー API のパス プレフィックス。
satori_secure = false # HTTPS と WSS で Satori サーバーに接続するかどうか。
satori_timeout = 30 # Satori API を呼び出す際のタイムアウト時間。単位は秒です。
satori_enable_listening_self_message = false # ボット自身が送信したメッセージを監視するかどうか。
satori_admin_roles = ["admin", "owner"] # 管理者として扱うギルドのロール ID または名前。
satori_typing_emoji = "⌛" # メッセージ処理中にメッセージに付加される応答絵文字の ID。プロトコルのサポートが必要です。空欄の場合は表示されません。
satori_limited_emoji = "❌" # メッセージ処理に失敗した際にメッセージに付加される応答絵文字の ID。プロトコルのサポートが必要です。空欄の場合は表示されません。

[bot_satori_secret]
# クライアントのキー設定項目です。ここに入力された値は、送信メッセージに誤って含まれた場合、ボットはそれを傍受しようとします。ただし、漏洩を防ぐよう注意してください。
satori_token = "<Replace me with str value>" # Satori サーバーへの接続に使用するトークン。サーバーに認証が設定されていない場合は空欄にします。
