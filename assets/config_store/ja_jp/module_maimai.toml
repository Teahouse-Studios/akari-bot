# https://toml.io/ja/v1.0.0
# 注：TOML は Python ではありませんので、ここでは Python の文法を使用しないでください。
# 例：TOML のブール値は小文字である必要があります。

[module_maimai]
# モジュールの設定項目です。ここに入力された値は、メッセージ内にプレーンテキストで表示されます。この部分には機密情報を入力しないでください。
diving_fish_client_id = "<Replace me with str value>"
lxns_client_id = "<Replace me with str value>"

[module_maimai_secret]
# モジュールのキー設定項目です。ここに入力された値は、送信メッセージに誤って含まれた場合、ボットはそれを傍受しようとします。ただし、漏洩を防ぐよう注意してください。
diving_fish_client_secret = "<Replace me with str value>" # 水鱼账号 OAuth 应用的 client_secret。公开客户端可留空。
lxns_developer_token = "<Replace me with str value>" # 落雪咖啡屋查分器的开发者令牌。
lxns_client_secret = "<Replace me with str value>" # 落雪咖啡屋 OAuth 应用的 client_secret。
