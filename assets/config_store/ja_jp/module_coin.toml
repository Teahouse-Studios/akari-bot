[module_coin]
# モジュールの設定項目です。ここに入力された値は、メッセージ内にプレーンテキストで表示されます。この部分には機密情報を入力しないでください。
coin_limit = 10000 # coin モジュールで投げられるコインの上限数。
coin_faceup_weight = 4997 # coin モジュールでコインを投げたときの表の重み。
coin_facedown_weight = 4997 # coin モジュールでコインを投げたときの裏の重み。
coin_stand_weight = 6 # coin モジュールでコインを投げたときに立つ重み。
