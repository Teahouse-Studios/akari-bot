# https://toml.io/ja/v1.0.0
# 注：TOML は Python ではありませんので、ここでは Python の文法を使用しないでください。
# 例：TOML のブール値は小文字である必要があります。

[bot_qqbot]
# クライアントの設定項目です。ここに入力された値は、メッセージ内にプレーンテキストで表示されます。この部分には機密情報を入力しないでください。
enable = false # このクライアントを有効にするかどうか。
qq_bot_appid = "<Replace me with (str, int) value>" # QQ ロボット（公式）の AppID。
qq_bot_openid = "<Replace me with str value>" # QQ ロボット（公式）の OpenID。
qq_bot_enable_send_url = false # QQ ロボット（公式）使用時に、URL 送信を有効にするかどうか。
qq_private_bot = false # QQ ロボット（公式）を使用する場合、プライベートドメイン ロボットであるかどうか。
qq_typing_emoji = 181 # QQ ロボット（公式）メッセージを処理するときにメッセージに添付される応答絵文字の ID。ID の詳細について：https://bot.q.qq.com/wiki/develop/api-v2/openapi/emoji/model.html#Emoji をご覧ください。
qq_limited_emoji = 10060 # QQ ロボット（公式）でメッセージ処理に失敗した際にメッセージに付加される応答絵文字の ID。ID の詳細について：https://bot.q.qq.com/wiki/develop/api-v2/openapi/emoji/model.html#Emoji をご覧ください。
qq_use_markdown = false # QQ ロボット（公式）使用時に、Markdown 形式のメッセージを使用するかどうか。（画像を保存するには、S3 互換 API を設定する必要があります）
qq_navigation_sync_strict = false # QQ ボット（公式）のグローバル メニューとコマンド パネルの同期に失敗した場合、クライアントの起動を阻止するかどうか。
qq_bot_uid = "<Replace me with str value>" # QQ 机器人（官方）的 UID，用于生成群聊权限配置链接。
qq_bot_qqnum = "<Replace me with str value>" # QQ 机器人（官方）的 QQ 号，用于生成群聊权限配置链接。

[bot_qqbot_secret]
# クライアントのキー設定項目です。ここに入力された値は、送信メッセージに誤って含まれた場合、ボットはそれを傍受しようとします。ただし、漏洩を防ぐよう注意してください。
qq_bot_secret = "<Replace me with str value>" # QQ ロボット（公式）の AppSecret。
