# https://toml.io/ja/v1.0.0
# 注：TOML は Python ではありませんので、ここでは Python の文法を使用しないでください。
# 例：TOML のブール値は小文字である必要があります。

[s3]
# S3 互換 API の設定項目です。ここに入力された値は、メッセージ内にプレーンテキストで表示されます。この部分には機密情報を入力しないでください。
s3_endpoint_url = "<Replace me with str value>" # S3 互換 API のエンドポイント URL。
s3_bucket = "<Replace me with str value>" # S3 互換 API のバケット名。
s3_region = "us-east-1" # S3 互換 API のリージョン名。
s3_public_endpoint = "<Replace me with str value>" # S3 互換 API のパブリック アクセス URL。
s3_internal_endpoint = "<Replace me with str value>" # S3 互換 API のイントラネット アクセス URL。
s3_temp_max_count = 20 # S3 互換 API における一時ファイルの最大数。
s3_connect_timeout = 30 # S3 兼容 API 的连接超时时间，单位为秒。
s3_read_timeout = 30 # S3 兼容 API 的网络读取超时时间，单位为秒。
s3_operation_timeout = 60 # S3 兼容 API 单次完整操作的最长等待时间，单位为秒。
s3_max_attempts = 2 # S3 兼容 API 单次请求包含首次请求在内的最大尝试次数。
s3_max_workers = 4 # S3 兼容 API 专用线程池的最大线程数。

[s3_secret]
# S3 互換 API のキー設定項目です。ここに入力された値は、送信メッセージに誤って含まれた場合、ボットはそれを傍受しようとします。ただし、漏洩を防ぐよう注意してください。
s3_access_key = "<Replace me with str value>" # S3 互換 API の AccessKey。
s3_secret_key = "<Replace me with str value>" # S3 互換 API の SecretKey。
