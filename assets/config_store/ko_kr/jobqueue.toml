# https://toml.io/ko/v1.0.0
# 주의: TOML은 Python이 아닙니다. Python 문법을 사용하지 마십시오.
# 예: TOML의 불리언 값은 반드시 소문자로 작성해야 합니다.

[jobqueue]
# JobQueue 的非敏感配置部分。请勿在此处填写访问令牌等敏感信息。

# 机器人客户端与服务端的通信依赖于 JobQueue，实例部署必须在 database 与 websocket 中选择一套完整后端。一般情况下你无需关注这些配置。（如遇 websocket 端口冲突可调整使用后端或端口）
# database：无需额外部署 Hub，且可在共享数据库中保留尚未过期的队列记录；但轮询、领取、心跳与清理均会增加数据库负载。不建议在使用 SQLite 作为数据库时使用。
# websocket：经 Hub 实时路由，延迟较低，且可以避免 JobQueue 对业务数据库的轮询和写入竞争；但需要维护 Hub、长连接以及远程连接所需的令牌和 TLS。
# 如需分布式部署，分布节点必须使用同一类型的后端。
jobqueue_backend = "websocket" # JobQueue 使用的完整传输后端，可选 database 或 websocket，不同后端之间的优缺点请参考以上注释。
jobqueue_node_id = "<Replace me with str value>" # JobQueue 节点标识，长度不得超过 128 个字符。留空时，启动阶段会生成 UUID 并写回配置；共用此配置的进程将归入同一部署节点。
jobqueue_websocket_mode = "embedded" # WebSocket Hub 部署模式，可选 embedded 或 external。embedded 由守护进程启动本机 Hub；external 连接独立部署的 Hub。
jobqueue_websocket_url = "ws://127.0.0.1:8765/jobqueue" # WebSocket JobQueue Hub 的统一地址。embedded 模式同时从该地址取得监听主机、端口和路径；external 模式将其作为客户端连接地址。
jobqueue_websocket_queue_size = 1000 # 每个 WebSocket Peer 的最大待发送帧数量，队列满时新投递将被拒绝。
jobqueue_websocket_max_message_bytes = 1048576 # 单个 WebSocket 协议帧允许的最大字节数。
jobqueue_websocket_command_timeout = 10 # WebSocket 控制命令的超时时间，单位为秒。

[jobqueue_secret]
# JobQueue 的密钥配置部分。机器人会尝试拦截意外出现在消息中的值，但仍须妥善保管以防泄露。
jobqueue_websocket_token = "<Replace me with str value>" # WebSocket JobQueue Hub 的共享访问令牌。留空时，启动阶段会生成安全随机密钥并写回配置；使用外部 Hub 的所有节点必须配置相同值。
