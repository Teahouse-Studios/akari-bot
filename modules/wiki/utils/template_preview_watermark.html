    <div id="akari-preview-watermark" aria-hidden="true" data-preview-partial="{{ 'true' if partial else 'false' }}">
        <svg class="akari-watermark-pattern" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="akari-watermark-tiles" patternUnits="userSpaceOnUse" width="800" height="384">
                    {% for row in range(4) %}
                    <g class="akari-watermark-row" data-row="{{ row }}">
                        <text class="akari-watermark-text akari-watermark-normal" x="24" y="{{ 40 + row * 96 }}">{{ watermark }}</text>
                        <text class="akari-watermark-text akari-watermark-normal" x="24" y="{{ 40 + row * 96 }}">{{ watermark }}</text>
                        <text class="akari-watermark-text akari-watermark-partial" x="24" y="{{ 40 + row * 96 }}">{{ watermark_partial }}</text>
                        <text class="akari-watermark-text akari-watermark-partial" x="24" y="{{ 40 + row * 96 }}">{{ watermark_partial }}</text>
                    </g>
                    {% endfor %}
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#akari-watermark-tiles)"></rect>
        </svg>
    </div>
