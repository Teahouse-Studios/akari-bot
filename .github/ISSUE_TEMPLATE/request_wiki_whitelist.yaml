name: 申请 Wiki 链接白名单
description: 提交申请 Wiki 链接白名单，使 QQ 平台的公共实例使用 `wiki` 模块查询时，能够直接展示对应 Wiki 页面链接。
title: "[REQUEST]: Wiki 链接白名单申请"
labels: ["request"]
assignees:
  - OasisAkari
  - DoroWolf
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 开始之前……
      description: 一个简单的判断方法：若此 Wiki 已被官方防火墙封锁，那么就没必要填写这个了。
      options:
        - label: 我已确定此 Wiki 中的内容没有任何涉嫌政治、色情、谩骂、暴力等不良内容。
          required: true
  - type: input
    id: user-id
    attributes:
      label: Wiki 链接
      description: 需要申请白名单的 Wiki 的链接。
      placeholder: e.g. https://zh.minecraft.wiki/wiki/Minecraft_Wiki
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: 备注
      description: 还想告诉我们什么？
      placeholder: 什么都可以哦，没有就算了吧。
    validations:
      required: false
