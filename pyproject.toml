[project.urls]
Homepage = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"

[dependency-groups]
dev = ["coverage>=7.9.1,<8.0.0", "pre-commit>=4.0.0,<5.0.0", "pytest>=9.0.2", "ruff>=0.15.1"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["akari_timeout: 覆盖单个测试的超时秒数"]
filterwarnings = ["ignore:cannot collect test class:pytest.PytestCollectionWarning"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E402", "F405", "F403", "E741", "E721"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
reportUndefinedVariable = "error"

